<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missions</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { overflow: hidden; }
    .w { display: flex; flex-direction: column; height: 100%; padding: 14px 14px 10px; gap: 10px; }
    .w-head { display: flex; align-items: center; gap: 10px; }
    .w-head img { width: 26px; height: 26px; }
    .w-head h1 { font-size: 17px; line-height: 1.2; }
    .w-head small { color: var(--muted); font-size: 12px; }
    .w-head .grow { flex: 1; min-width: 0; }
    .w-head { align-items: flex-start; }
    .w-xp { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 4px; }
    .w-xp .xp-bar { flex: 1; height: 6px; }
    #xptext { font-size: 11px; }
    #xp-pops { right: 12px; bottom: 44px; }
    .w .task-detail { padding-left: 10px; }
    .ring { --p: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 650;
      background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); }
    .ring span { width: 30px; height: 30px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-variant-numeric: tabular-nums; }
    .w .add-row { margin: 0; }
    .w .add-row input { min-height: 36px; }
    .w .btn.icon { width: 36px; min-height: 36px; }
    .w-list { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
    .w-list h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 4px; }
    .w-list h2:first-child { margin-top: 0; }
    .w .task label { min-height: 32px; }
    .w .task { font-size: 14px; }
    .w-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
    .done-msg { text-align: center; color: var(--muted); padding: 24px 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="w">
    <header class="w-head">
      <a href="./#/hero" target="_blank" rel="noopener" id="avatar" title="Ton héros"></a>
      <div class="grow">
        <h1>Mes missions</h1><small id="date"></small>
        <div class="w-xp"><b id="lvl"></b><div class="xp-bar"><i id="xpbar"></i></div><span id="streak"></span></div>
        <small id="xptext" class="muted"></small>
      </div>
    </header>
    <form class="add-row" id="add">
      <input name="t" placeholder="Ajouter pour aujourd’hui…" autocomplete="off">
      <button class="btn icon" aria-label="Ajouter">+</button>
    </form>
    <div class="w-list" id="list"></div>
    <footer class="w-foot">
      <a href="./#/today" target="_blank" rel="noopener">Ouvrir Life Planner ↗</a>
      <span id="count"></span>
    </footer>
  </div>
  <div id="xp-pops" aria-live="polite"></div>
  <script type="module" src="js/widget.js"></script>
</body>
</html>
