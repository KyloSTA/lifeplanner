<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life Planner</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Navigation principale">
      <div class="brand">
        <a href="#/today" class="brand-logo" id="brand-logo" title="Aujourd'hui" aria-label="Aujourd'hui"><img src="icons/icon.svg" alt="" width="32" height="32"></a>
        <div class="brand-main">
          <span>Life Planner</span>
          <div class="brand-tools">
            <a href="#/week" data-route="week" class="brand-ico" aria-label="Planificateur" title="Planificateur : semaine, mois, année et journal">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </a>
            <a href="#/notebook" data-route="notebook" class="brand-ico" aria-label="Carnet" title="Carnet">
              <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </a>
            <button type="button" class="brand-ico" id="brand-launch" aria-label="Lanceur" title="Lanceur" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 17.5h7M17.5 14v7"/></svg>
            </button>
          </div>
        </div>
      </div>
      <a href="#/hero" data-route="hero" class="hero-mini" id="hero-mini" aria-label="Ton héros"></a>
      <a href="#/today" data-route="today">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>Aujourd'hui</span>
      </a>
      <a href="#/missions" data-route="missions">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7.5 9l1.8 1.8L12.5 7.5M7.5 15.5l1.8 1.8 3.2-3.3M15 9.5h2.5M15 16h2.5"/></svg>
        <span>Missions</span>
      </a>
      <a href="#/brain" data-route="brain">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="11" cy="18" r="2.5"/><path d="M8.4 6.5l7.2 1M7 8.3l2.9 7.4M16.6 10.1l-4.2 5.8"/></svg>
        <span>Cerveau</span>
      </a>
      <a href="#/goals" data-route="goals">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
        <span>Objectifs</span>
      </a>
      <a href="#/news" data-route="news">
        <svg viewBox="0 0 24 24"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2"/><path d="M7.5 9h6M7.5 12.5h6M7.5 16h4"/></svg>
        <span>Actualités</span>
      </a>
      <a href="#/workout" data-route="workout">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
        <span>Workout</span>
      </a>
      <a href="#/rbq" data-route="rbq">
        <svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M9.5 21v-6h5v6"/></svg>
        <span>Cours RBQ</span>
      </a>
      <button type="button" class="rail-more" id="rail-more" aria-label="Plus d’onglets">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Plus</span>
      </button>
      <a href="#/settings" data-route="settings" class="rail-bottom">
        <svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span>Réglages</span>
      </a>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="xp-pops" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
